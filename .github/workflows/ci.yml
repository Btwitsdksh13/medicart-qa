name: MediCart QA
on:
  push:
  pull_request:
  schedule:
    - cron: '30 20 * * *'   # nightly regression
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [tests/api tests/contract, tests/ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22,  }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.suite }}
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ strategy.job-index }}
          path: |
            playwright-report
            results
  java-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: npm install --omit=dev
      - name: Start MediCart
        run: |
          PORT=3100 nohup node app/server.js > server.log 2>&1 &
          npx --yes wait-on http://localhost:3100/api/medicines
      - run: mvn -B -f java-api-tests/pom.xml test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-surefire-report
          path: java-api-tests/target/surefire-reports
