name: MediCart QA
on:
  push:
  pull_request:
  schedule:
    - cron: '30 20 * * *'   # nightly regression
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [tests/api tests/contract, tests/ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22,  }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.suite }}
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ strategy.job-index }}
          path: |
            playwright-report
            results
